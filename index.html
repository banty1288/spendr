<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />

    <!-- Cache Busting -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://apis.google.com https://*.firebaseio.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://* blob:; connect-src 'self' https://* wss://*; frame-src 'self' https://*;" />

    <!-- PWA & Android -->
    <meta name="theme-color" content="#000000" />
    <meta name="color-scheme" content="dark" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Spendr" />
    <meta name="application-name" content="Spendr" />
    <meta name="description" content="AI-powered personal finance companion. Track spending, get insights, and build better money habits." />

    <!-- Prevent phone number detection -->
    <meta name="format-detection" content="telephone=no" />

    <!-- Manifest -->
    <link rel="manifest" href="/manifest.json" />

    <!-- Fonts: Inter from Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />

    <title>Spendr — AI Finance</title>

    <style>
      html, body { height: 100%; margin: 0; overflow-x: hidden; }
      #root { height: 100%; }
      /* Prevent pull-to-refresh on Android */
      body { overscroll-behavior-y: contain; }
    </style>
  </head>

  <body>
    <script>
      // Force unregister service workers to break out of bad PWA cache
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(registrations) {
          let hasUnregistered = false;
          for(let registration of registrations) {
            registration.unregister();
            hasUnregistered = true;
          }
          if (hasUnregistered && !window.location.search.includes('cleared=1')) {
            window.location.href = window.location.pathname + '?cleared=1';
          }
        });
      }
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
